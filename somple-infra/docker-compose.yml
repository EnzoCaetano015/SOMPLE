services:
  db:
    image: postgres:16-alpine
    container_name: somple-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somple}
      POSTGRES_USER: ${POSTGRES_USER:-somple_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somple_app} -d ${POSTGRES_DB:-somple}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - somple-network

  backend:
    build:
      context: ..
      dockerfile: somple-infra/docker/backend/Dockerfile
    container_name: somple-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-somple}
      DB_USER: ${POSTGRES_USER:-somple_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      DB_CONNECT_TIMEOUT_SECONDS: 5

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_only_change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXP_HOURS: ${JWT_EXP_HOURS:-24}

      MODEL_NAME: ${MODEL_NAME:-somple-risk-classifier}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - somple-network

  frontend:
    build:
      context: ..
      dockerfile: somple-infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: somple-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - somple-network

volumes:
  postgres-data:

networks:
  somple-network:
    driver: bridge
