name: somple-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: somple_test
      POSTGRES_USER: somple_test
      POSTGRES_PASSWORD: somple_test
    ports:
      - "5433:5432"
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somple_test -d somple_test"]
      interval: 2s
      timeout: 3s
      retries: 15
