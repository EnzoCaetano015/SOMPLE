services:
  backend:
    build:
      context: ..
      dockerfile: somple-infra/docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.aws
    expose:
      - "8000"
    networks:
      - api-network

  api-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/api-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - api-network

networks:
  api-network:
    driver: bridge
